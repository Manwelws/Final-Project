[project]
name = "final-project"
version = "0.1.0"
description = "Production Customer Churn Prediction & Automated Drift Retraining System"
readme = "README.md"
authors = [
    { name = "Manwelws", email = "manwelwasfystu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "optuna==5.0.0",
    "mlflow==3.17.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.1",
    "plotly==7.1.0",
    "joblib==1.6.0",
    "shap==0.54.1",
]

[project.scripts]
churn = "final_project.cli:main"
final-project = "final_project.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.2.0",
]

services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-prediction-api:latest
    container_name: churn_prediction_service
    ports:
      - "8000:8000"
    environment:
      - CHURN_MODELS_DIR=/app/models
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
